name: Publish npm Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 可信发布（OIDC），无需 NPM_TOKEN
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建不使用缓存

      - name: 校验标签与 package.json 版本一致
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 版本 v${version} 不一致；请用 npm version 更新版本"
            exit 1
          fi

      - name: 下载发布产物到 vendor/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p vendor
          for attempt in $(seq 1 40); do
            if gh release download "v${version}" --dir vendor --pattern 'noldoj-*' --clobber 2>/dev/null; then
              count="$(find vendor -maxdepth 1 -type f -size +1k | wc -l)"
              if [ "$count" -ge 8 ]; then
                echo "已获取 ${count} 个平台产物"
                exit 0
              fi
            fi
            echo "等待 Release 产物就绪（第 ${attempt}/40 次）…"
            sleep 15
          done
          echo "::error::未能获取 v${version} 的发布产物"
          exit 1

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
