name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.1）；留空则使用最新提交中的 build X.Y.Z"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析版本
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, 'build ')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 检出代码（含全部历史与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # 由标签触发（例如 npm version patch 推送的 vX.Y.Z）
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            message="$(git log -1 --pretty=%s)"
            if [[ ! "$message" =~ ^build\ ([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::提交信息必须为 'build X.Y.Z'，当前为: $message"
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "发布版本: v$version"

  # ---------- Linux：x64 与 arm64 原生构建，x86 在 i386 容器内构建 ----------
  linux:
    name: linux-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            test: true
          - arch: arm64
            os: ubuntu-24.04-arm
            test: false
          - arch: x86
            os: ubuntu-24.04
            docker_image: i386/debian:bookworm
            test: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        if: ${{ !matrix.docker_image }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev file

      - name: 构建（原生）
        if: ${{ !matrix.docker_image }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir -p dist
          cp build/noldoj "dist/noldoj-linux-${{ matrix.arch }}"
          chmod +x "dist/noldoj-linux-${{ matrix.arch }}"
          file "dist/noldoj-linux-${{ matrix.arch }}"

      - name: 构建（i386 容器）
        if: ${{ matrix.docker_image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.docker_image }}" bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends build-essential cmake ninja-build libcurl4-openssl-dev ca-certificates file
            cmake -S . -B build-x86 -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build-x86
            mkdir -p dist
            cp build-x86/noldoj dist/noldoj-linux-x86
            chmod +x dist/noldoj-linux-x86
            file dist/noldoj-linux-x86
          '

      - name: 测试（仅 Linux x64）
        if: matrix.test
        run: python3 tests/run_tests.py "dist/noldoj-linux-${{ matrix.arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: noldoj-linux-${{ matrix.arch }}
          path: dist/noldoj-linux-${{ matrix.arch }}
          if-no-files-found: error

  # ---------- Windows：x64/x86 用 MinGW 原生，arm64 用 llvm-mingw 交叉 ----------
  windows:
    name: windows-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2022
            msystem: MINGW64
            test: true
          - arch: x86
            os: windows-2022
            msystem: MINGW32
            test: false
          - arch: arm64
            os: ubuntu-24.04
            msystem: ""

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSYS2 / MinGW-w64
        if: ${{ matrix.msystem }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja' || 'mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-ninja' }}

      - name: 构建（MinGW）
        if: ${{ matrix.msystem }}
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build
          mkdir -p dist
          cp build/noldoj.exe "dist/noldoj-windows-${{ matrix.arch }}.exe"

      - name: 构建（Windows arm64 / llvm-mingw）
        if: ${{ !matrix.msystem }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build file
          # 只取宿主机为 x86_64 的发行包（aarch64 宿主的包无法在 runner 上运行）
          url="$(gh api repos/mstorsjo/llvm-mingw/releases/latest \
            --jq '.assets[].browser_download_url' | grep 'ucrt-ubuntu' | grep 'x86_64' | head -1)"
          echo "使用 llvm-mingw: $url"
          curl -sSL "$url" -o llvm-mingw.tar.xz
          tar xf llvm-mingw.tar.xz
          export PATH="$PWD/$(ls -d llvm-mingw-*-x86_64)/bin:$PATH"
          aarch64-w64-mingw32-clang++ --version
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=aarch64-w64-mingw32-clang++ \
            -DCMAKE_RC_COMPILER=aarch64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-arm64
          mkdir -p dist
          cp build-arm64/noldoj.exe dist/noldoj-windows-arm64.exe
          file dist/noldoj-windows-arm64.exe

      - name: 测试（仅 Windows x64）
        if: matrix.test
        run: python tests/run_tests.py "dist/noldoj-windows-${{ matrix.arch }}.exe"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: noldoj-windows-${{ matrix.arch }}
          path: dist/noldoj-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

  # ---------- macOS：同一 runner 上分别产出 arm64 与 x64 ----------
  macos:
    name: macos
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 arm64 与 x64
        run: |
          set -euxo pipefail
          for arch in arm64 x86_64; do
            cmake -S . -B "build-$arch" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build "build-$arch"
          done
          mkdir -p dist
          cp build-arm64/noldoj dist/noldoj-macos-arm64
          cp build-x86_64/noldoj dist/noldoj-macos-x64
          chmod +x dist/noldoj-macos-*
          file dist/noldoj-macos-*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: noldoj-macos
          path: dist/noldoj-macos-*
          if-no-files-found: error

  # ---------- 汇总并发布 ----------
  publish:
    name: 创建 Release
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码（含全部历史与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: noldoj-*
          path: dist
          merge-multiple: true

      - name: 整理发布产物
        run: |
          set -euo pipefail
          chmod +x dist/noldoj-linux-* dist/noldoj-macos-* 2>/dev/null || true
          ls -lh dist

      - name: 生成发布说明（自上次 Release 以来的全部提交）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prev_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
          if [[ -n "$prev_tag" ]]; then
            range="${prev_tag}..HEAD"
            range_label="自 ${prev_tag} 以来的全部提交"
          else
            range="HEAD"
            range_label="自仓库首个提交以来的全部提交"
          fi
          {
            echo "## ${range_label}"
            echo
            git log "$range" --pretty=format:'- %s (%h)'
            echo
            echo
            echo "## 构建产物"
            echo
            ls dist | sed 's/^/- `/; s/$/`/'
          } > notes.md
          echo "----- notes.md -----"
          cat notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          args=("$tag" dist/* --title "NoldOJ CLI $tag" --notes-file notes.md --latest)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # 标签已存在（由 npm version 创建），直接在该标签上建发布
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"
